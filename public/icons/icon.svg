<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Paper Tray Sheet (Top) -->
  <path d="M144 140 C144 120, 156 104, 176 104 L336 104 C356 104, 368 120, 368 140 L368 210 L144 210 Z" fill="url(#sheetGrad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))"/>
  
  <!-- Paper Lines -->
  <line x1="184" y1="140" x2="328" y2="140" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="184" y1="165" x2="280" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Printer Main Body -->
  <rect x="88" y="200" width="336" height="170" rx="28" fill="url(#printerGrad)" stroke="#475569" stroke-width="6"/>
  
  <!-- Paper Output Slot -->
  <rect x="136" y="270" width="240" height="70" rx="14" fill="#090d16" stroke="#334155" stroke-width="3"/>

  <!-- Output Printed Document -->
  <path d="M160 290 L352 290 L352 400 C352 414, 340 424, 326 424 L186 424 C172 424, 160 414, 160 400 Z" fill="url(#sheetGrad)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))"/>

  <!-- Document Graphic Lines & Ink Dots on Sheet -->
  <line x1="190" y1="330" x2="322" y2="330" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="190" y1="355" x2="300" y2="355" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="190" y1="380" x2="260" y2="380" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- 4 Ink Level Dots (CMYK) on printer control strip -->
  <circle cx="130" cy="235" r="9" fill="#00a0e9" filter="url(#glow)"/>
  <circle cx="156" cy="235" r="9" fill="#e4007f" filter="url(#glow)"/>
  <circle cx="182" cy="235" r="9" fill="#facc15" filter="url(#glow)"/>
  <circle cx="208" cy="235" r="9" fill="#f8fafc" filter="url(#glow)"/>

  <!-- Status Power LED (Green) -->
  <circle cx="376" cy="235" r="8" fill="#10b981" filter="url(#glow)"/>
</svg>
